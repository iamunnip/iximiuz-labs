# Four Ubuntu 26.04 VMs in one playground, each with a single OS disk.
# Totals: 10 vCPU, 16 GiB RAM, 240 GiB disk, which are the per playground limits.
kind: playground
name: 4vm
title: Ubuntu 26.04, 4 VMs, 10 vCPU, 16 GiB RAM, 240 GiB disk
description: Four Ubuntu 26.04 VMs on one private network. dev-machine has 1 vCPU, 1 GiB RAM and 30 GiB disk. control-plane, node-01 and node-02 each have 3 vCPU, 5 GiB RAM and 70 GiB disk.
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: dev-machine
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: ubuntu-26-04
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 1
        ramSize: 1GiB
    - name: control-plane
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: ubuntu-26-04
          mount: /
          size: 70GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 3
        ramSize: 5GiB
    - name: node-01
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: ubuntu-26-04
          mount: /
          size: 70GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 3
        ramSize: 5GiB
    - name: node-02
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: ubuntu-26-04
          mount: /
          size: 70GiB
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 3
        ramSize: 5GiB
  tabs:
    - id: terminal-dev-machine
      kind: terminal
      name: dev-machine
      machine: dev-machine
    - id: terminal-control-plane
      kind: terminal
      name: control-plane
      machine: control-plane
    - id: terminal-node-01
      kind: terminal
      name: node-01
      machine: node-01
    - id: terminal-node-02
      kind: terminal
      name: node-02
      machine: node-02
