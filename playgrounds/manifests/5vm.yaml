# One Ubuntu 26.04 VM: 4 vCPU, 10 GiB RAM, 20 GiB OS disk, 80 GiB data disk on /data.
kind: playground
name: 5vm
title: Ubuntu 26.04, 4 vCPU, 10 GiB RAM, 20+80 GiB disks
description: Single Ubuntu 26.04 VM with 4 vCPU, 10 GiB RAM, a 20 GiB OS disk and an 80 GiB data disk mounted on /data.
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: vm
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: ubuntu-26-04
          mount: /
          size: 20GiB
        - mount: /data
          size: 80GiB
          filesystem: ext4
      network:
        interfaces:
          - network: local
      resources:
        cpuCount: 4
        ramSize: 10GiB
  tabs:
    - id: terminal-vm
      kind: terminal
      name: vm
      machine: vm
